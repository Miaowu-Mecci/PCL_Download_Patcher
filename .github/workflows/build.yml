name: Build Download Patcher

on:
  push:
    branches: [main]
    paths:
      - '*.cs'
      - '*.csproj'
      - 'patch.bin'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-download-patcher
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - name: Build standalone patcher
        run: msbuild PclDownloadPatcher.csproj /p:Configuration=Release /nologo
      - name: Test patching and backup behavior
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'bin/Release/PCL-myPCL-DownloadPatcher.exe'
          $report = Join-Path $PWD 'patcher-tests.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test', $report -Wait -PassThru
          if (Test-Path $report) { Get-Content -Encoding utf8 $report }
          if ($process.ExitCode -ne 0) { throw "Patcher tests failed: $($process.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item bin/Release/PCL-myPCL-DownloadPatcher.exe dist/
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/PCL-myPCL-DownloadPatcher.exe, dist/README.md -DestinationPath dist/PCL-myPCL-DownloadPatcher-v1.0.0.zip
          Get-ChildItem dist -File | Where-Object Extension -in '.exe', '.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PCL-myPCL-DownloadPatcher
          path: |
            dist/*
            patcher-tests.txt
      - name: Publish tested Windows patcher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = 'pcl-download-patcher-v1.0.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/PCL-myPCL-DownloadPatcher.exe dist/PCL-myPCL-DownloadPatcher-v1.0.0.zip dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/PCL-myPCL-DownloadPatcher.exe dist/PCL-myPCL-DownloadPatcher-v1.0.0.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'PCL myPCL 一次性下载修复补丁 v1.0.0' --notes-file README.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
      - name: Remove superseded launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release view v2.99.0-myPCL.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete v2.99.0-myPCL.1 --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Unable to remove superseded launcher release' }
          }
          exit 0
